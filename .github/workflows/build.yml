name: Build

# Manual builds default to one Mac architecture to conserve the private-repo quota.
# Version tags still build signed releases for every desktop platform.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Build target (aarch64 = Apple Silicon, x86_64 = Intel)"
        type: choice
        default: aarch64-apple-darwin
        options:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - x86_64-pc-windows-msvc
          - x86_64-unknown-linux-gnu
          - all
  push:
    tags: ["v*"]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    permissions:
      contents: read
    name: ${{ matrix.target }}
    runs-on: ${{ contains(matrix.target, 'windows') && 'windows-latest' || contains(matrix.target, 'linux') && 'ubuntu-22.04' || (matrix.target == 'x86_64-apple-darwin' && 'macos-15-intel' || 'macos-15') }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON((github.event_name == 'push' || inputs.target == 'all') && '["x86_64-pc-windows-msvc","x86_64-unknown-linux-gnu","aarch64-apple-darwin","x86_64-apple-darwin"]' || format('["{0}"]', inputs.target)) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev file

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # npm 11 (Node 24+) wrote package-lock.json; npm 10 rejects it in `npm ci`.
          node-version: 24
          cache: npm

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: npm ci

      # The `cairngorm` terminal command each installer ships (Windows and macOS bundle it).
      - name: Terminal command tests
        run: cargo test --locked --manifest-path src/app/cli/Cargo.toml

      - name: Configure Windows release signing
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:CERTIFICATE -or -not $env:CERTIFICATE_PASSWORD) { throw 'Release signing certificate is required for tagged Windows builds.' }
          New-Item -ItemType Directory -Force logs | Out-Null
          $certPath = Join-Path $env:RUNNER_TEMP 'cairngorm-signing.pfx'
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:CERTIFICATE))
          try {
            $certificate = Import-PfxCertificate -FilePath $certPath -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString $env:CERTIFICATE_PASSWORD -AsPlainText -Force) | Where-Object HasPrivateKey | Select-Object -First 1
            if (-not $certificate) { throw 'Certificate must include its private key.' }
            @{ bundle = @{ windows = @{ certificateThumbprint = $certificate.Thumbprint; digestAlgorithm = 'sha256'; timestampUrl = 'http://timestamp.digicert.com' } } } | ConvertTo-Json -Depth 5 | Set-Content logs/windows-signing.json
          } finally { Remove-Item -LiteralPath $certPath -Force }

      - name: Bundle signed Windows release
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/')
        run: npx tauri build --target ${{ matrix.target }} --config logs/windows-signing.json

      - name: Bundle macOS
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]] && [[ -z "$APPLE_CERTIFICATE" || -z "$APPLE_SIGNING_IDENTITY" || -z "$APPLE_ID" || -z "$APPLE_PASSWORD" || -z "$APPLE_TEAM_ID" ]]; then
            echo 'Signing and notarization credentials are required for tagged macOS builds.'
            exit 1
          fi
          if [[ -z "$APPLE_CERTIFICATE" ]]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          npx tauri build --target ${{ matrix.target }}

      - name: Bundle development or Linux
        if: runner.os == 'Linux' || (runner.os == 'Windows' && !startsWith(github.ref, 'refs/tags/'))
        run: npx tauri build --target ${{ matrix.target }}

      # Built outside Tauri so linuxdeploy cannot corrupt the Bun sidecar.
      - name: Bundle Linux AppImage
        if: runner.os == 'Linux'
        run: bash scripts/ci/build-appimage.sh ${{ matrix.target }}

      - name: Generate SBOMs and checksums
        run: node scripts/release-evidence.mjs ${{ matrix.target }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cairngorm-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            logs/release-evidence/${{ matrix.target }}/
