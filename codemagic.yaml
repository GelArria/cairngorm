# macOS installers on Codemagic. A GitHub webhook starts both workflows on every push
# to dev and on release tags: Apple Silicon (tests, then the .dmg) and Intel (the .dmg,
# cross-built on the same M2 machine and smoke-tested under Rosetta when available).
# The Apple Silicon workflow can also be started by hand with either architecture.
# Signing is optional: add an "apple_signing" variable group in Codemagic with
# APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD,
# APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID, then
# uncomment `groups` in both workflows. Without it the .dmg is unsigned.
definitions:
  triggering: &triggering
    events:
      - push
      - tag
    branch_patterns:
      - pattern: dev
        include: true
    tag_patterns:
      - pattern: "v*"
        include: true
    cancel_previous_builds: true
  cache: &cache
    cache_paths:
      - ~/.cargo/registry
      - ~/.cargo/git
  artifacts: &artifacts
    - src-tauri/target/*/release/bundle/dmg/*.dmg
    - logs/release-evidence/**
    - logs/smoke/**
  scripts:
    - &install_tools
      name: Install Rust and Bun
      script: |
        export PATH="$HOME/.cargo/bin:$HOME/.bun/bin:$PATH"
        if ! command -v rustup >/dev/null 2>&1; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | RUSTUP_INIT_SKIP_PATH_CHECK=yes sh -s -- -y --profile minimal
        fi
        rustup toolchain install stable --profile minimal
        rustup default stable
        rustup target add "$TARGET"
        curl -fsSL https://bun.sh/install | bash -s "bun-v$BUN_VERSION"
        echo "PATH=$HOME/.cargo/bin:$HOME/.bun/bin:$PATH" >> "$CM_ENV"
        rustc --version && bun --version && node --version
    - &npm_ci
      name: Install npm dependencies
      script: npm ci
    - &bundle
      name: Bundle macOS
      script: |
        if [ -z "${APPLE_CERTIFICATE:-}" ]; then
          unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          echo "No signing credentials: building an unsigned .dmg"
        elif [ -z "${APPLE_SIGNING_IDENTITY:-}" ] || [ -z "${APPLE_ID:-}" ] || [ -z "${APPLE_PASSWORD:-}" ] || [ -z "${APPLE_TEAM_ID:-}" ]; then
          echo "apple_signing group is incomplete: set every APPLE_* variable."
          exit 1
        fi
        npx tauri build --target "$TARGET"
    - &smoke
      name: Install + launch smoke test
      script: bash scripts/ci/smoke-macos.sh "$TARGET"
    - &evidence
      name: Generate SBOMs and checksums
      script: node scripts/release-evidence.mjs "$TARGET"

workflows:
  macos-installer:
    name: macOS installer (Apple Silicon)
    instance_type: mac_mini_m2
    max_build_duration: 90
    inputs:
      target:
        description: "Architecture (aarch64 = Apple Silicon, x86_64 = Intel)"
        type: choice
        default: aarch64-apple-darwin
        options:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
      run_tests:
        description: "Run Rust and agent tests on macOS before bundling"
        type: boolean
        default: true
    labels:
      - ${{ inputs.target }}
    environment:
      # groups:
      #   - apple_signing
      node: 24
      xcode: latest
      vars:
        TARGET: ${{ inputs.target }}
        BUN_VERSION: "1.3.14"
    triggering: *triggering
    cache: *cache
    scripts:
      - *install_tools
      - *npm_ci
      # Shipped dependencies against the RustSec and GitHub advisory databases (via OSV).
      - name: Dependency audit
        script: node scripts/audit-deps.mjs
        when:
          condition: ${{ inputs.run_tests }}
      # Frontend tests are platform-independent and run in the Linux CI.
      - name: Agent sidecar tests
        working_directory: src/agent/core
        script: |
          bun install --frozen-lockfile
          bunx tsc --noEmit
          bun test
        when:
          condition: ${{ inputs.run_tests }}
      - name: Rust tests (macOS code paths)
        script: |
          node scripts/build-agent.mjs
          node scripts/build-cli.mjs
          cargo test --no-default-features --manifest-path src-tauri/Cargo.toml
          cargo test --locked --manifest-path src/app/cli/Cargo.toml
        when:
          condition: ${{ inputs.run_tests }}
      - *bundle
      - *smoke
      - *evidence
    artifacts: *artifacts

  # Tests already ran on Apple Silicon for the same commit; this builds the Intel .dmg.
  macos-installer-intel:
    name: macOS installer (Intel)
    instance_type: mac_mini_m2
    max_build_duration: 90
    labels:
      - x86_64-apple-darwin
    environment:
      # groups:
      #   - apple_signing
      node: 24
      xcode: latest
      vars:
        TARGET: x86_64-apple-darwin
        BUN_VERSION: "1.3.14"
    triggering: *triggering
    cache: *cache
    scripts:
      - *install_tools
      - *npm_ci
      - *bundle
      - *smoke
      - *evidence
    artifacts: *artifacts
